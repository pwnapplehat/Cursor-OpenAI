# Canonical Hermes config blocks for the Cursor-OpenAI gateway integration.
# This is a REFERENCE snippet for manual setup - merge it into the file that
# `hermes config path` prints (usually ~/.hermes/config.yaml, or
# %LOCALAPPDATA%\hermes\config.yaml on Windows). The setup scripts apply the
# same values through Hermes' own `hermes config set` CLI instead.
#
# Adjust the port if your gateway doesn't run on 8787, and replace
# no-key-required with your AUTH_KEY if the gateway has one configured.

# --- Required: gateway as a NAMED provider + main model -----------------------
# "custom:cursor" (named) rather than bare "custom" is what enables live
# /v1/models discovery in Hermes' /model picker.
model:
  default: composer-2.5
  provider: custom:cursor
  base_url: http://localhost:8787/v1
  api_key: no-key-required

custom_providers:
  - name: cursor
    base_url: http://localhost:8787/v1
    api_key: no-key-required

# ALSO add to Hermes' .env (path: `hermes config env-path`) - NOT this file.
# Hermes' /model switches and dashboard resets strip base_url/api_key from
# the model: block above; these env fallbacks are honored on every
# custom-provider code path and nothing ever rewrites .env, making endpoint
# resolution permanently immune to that stripping:
#
#   CUSTOM_BASE_URL=http://localhost:8787/v1
#   CUSTOM_API_KEY=no-key-required

# --- Optional: long-running session profile ------------------------------------
# For autonomous tasks that run for hours or days. Sessions never auto-reset
# (no daily wipe, no idle wipe - /new and /reset still work manually), the
# per-turn tool-loop budget is raised, and the compression summarizer is
# pinned to the gateway's NAMED provider entry so it provably has working
# credentials. (Not the "main" label: Hermes resolves that through its
# runtime provider label, which inside the messaging gateway is bare
# "custom" - a credential-less path, so summaries silently fail and
# compression drops middle turns unsummarized.)
#
# Pair this with the gateway-side values in the repo's .env:
#   REQUEST_TIMEOUT_MS=1800000    # 30 min - matches Hermes' HERMES_API_TIMEOUT
#   SESSION_TTL_MS=86400000       # 24 h cached-agent retention
# (then restart the gateway).
session_reset:
  mode: none

agent:
  max_turns: 300

auxiliary:
  compression:
    provider: custom:cursor
    model: composer-2.5   # match your model.default
